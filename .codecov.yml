coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
        if_not_found: failure
    patch:
      default:
        target: 95%     # e.g. 95% of changed lines must be covered
        threshold: 0%    # allow no drop
        if_not_found: failure
        informational: false
        
flag_management:
  individual_flags:
    - name: services
      paths:
        - Services/**
    - name: reporting_service
      paths:
        - Services/reporting_service/**