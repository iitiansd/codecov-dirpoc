name: Run tests and upload coverage with flags

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Detect changes to determine which services need testing
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      scripts_v2: ${{ steps.changes.outputs.scripts_v2 }}
      python_v2: ${{ steps.changes.outputs.python_v2 }}
      schedulers: ${{ steps.changes.outputs.schedulers }}
      services: ${{ steps.changes.outputs.services }}
      java_libs: ${{ steps.changes.outputs.java_libs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changed files
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            scripts_v2:
              - 'scripts_v2/**'
            python_v2:
              - 'python_v2/**'
            schedulers:
              - 'schedulers/**'
            services:
              - 'services/**'
            java_libs:
              - 'java-libs-v2/**'

  # Test scripts_v2
  test-scripts-v2:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts_v2 == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV
      
      - name: Run scripts_v2 tests with coverage
        run: |
          pytest scripts_v2/ -v --cov=scripts_v2 --cov-report=xml:coverage-scripts-v2.xml
      
      - name: Upload scripts_v2 coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-scripts-v2.xml
          flags: scripts_v2
          name: scripts-v2-coverage
          fail_ci_if_error: false

  # Test python_v2
  test-python-v2:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.python_v2 == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV
      
      - name: Run python_v2 tests with coverage
        run: |
          pytest python_v2/ -v --cov=python_v2 --cov-report=xml:coverage-python-v2.xml
      
      - name: Upload python_v2 coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-python-v2.xml
          flags: python_v2
          name: python-v2-coverage
          fail_ci_if_error: false

  # Test schedulers
  test-schedulers:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.schedulers == 'true'
    strategy:
      matrix:
        scheduler: [test_scheduler, dag_scheduler, email_scheduler, simple_job_scheduler]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV
      
      - name: Run scheduler tests with coverage
        run: |
          if [ -d "schedulers/${{ matrix.scheduler }}" ]; then
            pytest schedulers/${{ matrix.scheduler }}/ -v --cov=schedulers/${{ matrix.scheduler }} --cov-report=xml:coverage-scheduler-${{ matrix.scheduler }}.xml
          fi
      
      - name: Upload scheduler coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-scheduler-${{ matrix.scheduler }}.xml
          flags: schedulers,schedulers_${{ matrix.scheduler }}
          name: scheduler-${{ matrix.scheduler }}-coverage
          fail_ci_if_error: false

  # Test services
  test-services:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services == 'true'
    strategy:
      matrix:
        service: [email_service, reporting_service]
        include:
          - service: email_service
            flag: services_email
          - service: reporting_service
            flag: services_reporting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV
      
      - name: Run service tests with coverage
        run: |
          if [ -d "services/${{ matrix.service }}" ]; then
            pytest services/${{ matrix.service }}/ -v --cov=services/${{ matrix.service }} --cov-report=xml:coverage-service-${{ matrix.service }}.xml
          fi
      
      - name: Upload service coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-service-${{ matrix.service }}.xml
          flags: services,${{ matrix.flag }}
          name: service-${{ matrix.service }}-coverage
          fail_ci_if_error: false

  test-java-libs:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.java_libs == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build and test with Maven
        working-directory: java-libs-v2/api-logging-client
        run: |
          mvn clean test -B
      - name: Upload JaCoCo coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./java-libs-v2/api-logging-client/target/jacoco/jacoco.xml
          flags: java_libs
          name: java-libs-coverage
          fail_ci_if_error: false

  combined-coverage:
    runs-on: ubuntu-latest
    needs: [test-scripts-v2, test-python-v2, test-schedulers, test-services, test-java-libs]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV
      - name: Run all Python tests with combined coverage
        run: |
          pytest -v --cov=. --cov-config=.coveragerc --cov-report=xml:coverage-combined.xml \
            --ignore=services/dummy_service_ignore_me/
      
      - name: Upload combined coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-combined.xml,./java-libs-v2/api-logging-client/target/jacoco/jacoco.xml
          flags: scripts_v2,python_v2,schedulers,services,java_libs
          name: combined-coverage
          fail_ci_if_error: true