name: Run tests and upload coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov codecov coverage

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      # ─────────────────────────────────────────────────────────────────────
      # 1️⃣  Services component (excludes reporting_service via .coveragerc.services)
      - name: Coverage for Services (exclude reporting_service)
        run: |
          coverage run --rcfile=.coveragerc.services -m pytest --maxfail=1 --disable-warnings -q
          coverage xml -o coverage-services.xml
      - name: Upload Services coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-services.xml
          flags: services
          fail_ci_if_error: true

      # ─────────────────────────────────────────────────────────────────────
      # 2️⃣  reporting_service component (only Services/reporting_service via .coveragerc.reporting_service)
      - name: Coverage for reporting_service only
        run: |
          coverage run --rcfile=.coveragerc.reporting_service -m pytest Services/reporting_service --maxfail=1 --disable-warnings -q
          coverage xml -o coverage-reporting.xml
      - name: Upload reporting_service coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-reporting.xml
          flags: reporting_service
          fail_ci_if_error: true
